name: Build Android smoke APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/PocketMU.SmokeAndroid/**'
      - '.github/workflows/build-android-smoke.yml'

permissions:
  contents: read

jobs:
  build-android-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Install .NET Android workload
        shell: pwsh
        run: dotnet workload install android
      - name: Create smoke signing key
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          keytool -genkeypair -v -keystore publish/smoke.keystore -storepass android -keypass android -alias smoke -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PocketMU Smoke,O=PocketMU,C=US"
      - name: Publish ARM64 signed APK
        shell: pwsh
        run: dotnet publish src/PocketMU.SmokeAndroid/PocketMU.SmokeAndroid.csproj -c Release -f net10.0-android -r android-arm64 -o publish/smoke -p:AndroidSdkDirectory=$env:ANDROID_SDK_ROOT -p:AcceptAndroidSdkLicenses=true -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$pwd/publish/smoke.keystore -p:AndroidSigningStorePass=android -p:AndroidSigningKeyAlias=smoke -p:AndroidSigningKeyPass=android
      - name: Verify APK exists
        shell: pwsh
        run: |
          $apk = Get-ChildItem -LiteralPath publish/smoke -Filter *.apk -File
          if (-not $apk) { throw 'No APK was produced.' }
          Get-FileHash -Algorithm SHA256 $apk.FullName
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketmu-gate-a-smoke-apk
          path: publish/smoke/*.apk
